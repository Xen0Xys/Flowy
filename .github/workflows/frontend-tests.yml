name: Frontend Tests

on:
    pull_request:
        paths:
            - "web/**"
            - ".github/workflows/frontend-tests.yml"
    push:
        branches:
            - main
        paths:
            - "web/**"
            - ".github/workflows/frontend-tests.yml"

jobs:
    test-frontend-e2e:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18.1-alpine
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: flowy_test
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowy_test
            APP_SECRET: supersecret
            APP_NAME: "Flowy Server"
            NODE_ENV: test
            NUXT_PUBLIC_API_BASE: "http://localhost:4000"

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Install dependencies
              run: bun install

            - name: Generate Prisma client & Migrate Database
              working-directory: server
              run: |
                  bunx prisma generate
                  bunx prisma migrate deploy
                  bunx prisma db seed

            - name: Start Backend
              working-directory: server
              run: bun run dev &

            - name: Wait for backend to be ready
              run: |
                  echo "Waiting for backend on port 4000..."
                  bunx wait-on tcp:4000 -t 60000

            - name: Install Playwright browsers
              working-directory: web
              run: bunx playwright install --with-deps

            - name: Run frontend tests
              working-directory: web
              run: bun run test
